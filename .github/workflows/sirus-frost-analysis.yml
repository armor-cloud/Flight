name: Sirus Frost DK analysis

on:
  workflow_dispatch:
  push:
    branches:
      - sirus-frost-analysis
    paths:
      - 'tools/sirus_frost_analysis/**'
      - '.github/workflows/sirus-frost-analysis.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/sirus_frost_analysis/requirements.txt

      - name: Fetch Sirus HM data
        env:
          SIRUS_WEEK_FROM: '2026-07-23'
          SIRUS_WEEK_TO: '2026-08-18'
        run: python tools/sirus_frost_analysis/fetch_sirus.py

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: sirus-frost-analysis
          path: artifacts/sirus_frost/
          if-no-files-found: error
          retention-days: 14
