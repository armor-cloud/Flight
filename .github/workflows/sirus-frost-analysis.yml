name: Sirus Frost DK analysis

on:
  workflow_dispatch:
  push:
    branches:
      - sirus-frost-analysis
    paths:
      - 'tools/sirus_frost_analysis/**'
      - '.github/workflows/sirus-frost-analysis.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sirus-frost-analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/sirus_frost_analysis/requirements.txt

      - name: Collect final auditable HM dataset
        run: python tools/sirus_frost_analysis/collect_final.py

      - name: Publish compact final review files to branch
        if: always()
        run: |
          rm -rf analysis_output/final
          mkdir -p analysis_output/final/raw_specializations
          cp artifacts/sirus_frost/final/summary.csv analysis_output/final/ 2>/dev/null || true
          cp artifacts/sirus_frost/final/specializations_long.csv analysis_output/final/ 2>/dev/null || true
          cp artifacts/sirus_frost/final/frost_proof.csv analysis_output/final/ 2>/dev/null || true
          cp artifacts/sirus_frost/final/request_manifest.csv analysis_output/final/ 2>/dev/null || true
          cp artifacts/sirus_frost/final/run_info.json analysis_output/final/ 2>/dev/null || true
          cp artifacts/sirus_frost/final/raw/specializations/*.json analysis_output/final/raw_specializations/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_output/final
          git diff --cached --quiet || git commit -m "Update final Sirus HM analysis [skip ci]"
          git push origin HEAD:sirus-frost-analysis

      - name: Upload full final analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirus-frost-final
          path: artifacts/sirus_frost/final/
          if-no-files-found: warn
          retention-days: 14
