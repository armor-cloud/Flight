name: Sirus Frost DK analysis

on:
  workflow_dispatch:
  push:
    branches:
      - sirus-frost-analysis
    paths:
      - 'tools/sirus_frost_analysis/**'
      - '.github/workflows/sirus-frost-analysis.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sirus-frost-analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/sirus_frost_analysis/requirements.txt

      - name: Collect boss-specific top-40 player-log dataset
        run: python tools/sirus_frost_analysis/collect_players_top40.py

      - name: Publish compact player top-40 review files to branch
        if: always()
        run: |
          rm -rf analysis_output/player_top40
          mkdir -p analysis_output/player_top40
          cp artifacts/sirus_frost/player_top40/boss_summary.csv analysis_output/player_top40/ 2>/dev/null || true
          cp artifacts/sirus_frost/player_top40/spec_summary.csv analysis_output/player_top40/ 2>/dev/null || true
          cp artifacts/sirus_frost/player_top40/frost_proof.csv analysis_output/player_top40/ 2>/dev/null || true
          cp artifacts/sirus_frost/player_top40/run_info.json analysis_output/player_top40/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_output/player_top40
          git diff --cached --quiet || git commit -m "Update boss-specific Sirus top-40 analysis [skip ci]"
          git push origin HEAD:sirus-frost-analysis

      - name: Upload full player top-40 analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sirus-frost-player-top40
          path: artifacts/sirus_frost/player_top40/
          if-no-files-found: warn
          retention-days: 14
